[pytest]
# Cache directory — pytest expands $HOME via _pytest/pathlib.py:resolve_from_str,
# so this lands at /home/leap-aide-init/.pytest_cache instead of <rootdir>/.pytest_cache.
# Required for the leap-aide-cicd Docker image: <rootdir> there is /build (root-owned),
# and pytest's default cache write triggers PytestCacheWarning + PermissionError.
cache_dir = $HOME/.pytest_cache