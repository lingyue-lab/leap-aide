<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/logo/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Leap Aide</title>
    <script>
      // Theme & font initialization — must run before paint.
      // Prefer server-injected values (from settings.json) so settings survive
      // server restarts and new browser sessions. Fall back to localStorage.
      (function() {
        var injected = window.__HERMES_INJECTED__ || {};

        // Theme
        var t = injected.theme || localStorage.getItem('hermes-theme');
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (!t) t = 'dark';
        document.documentElement.setAttribute('data-theme', t);

        // Font size
        var fs = injected.font_size || localStorage.getItem('hermes-font-size') || 'medium';
        var zoomMap = { small: '0.8', medium: '1', large: '1.3' };
        document.documentElement.setAttribute('data-font-size', fs);
        document.documentElement.style.setProperty('--app-zoom', zoomMap[fs] || '1');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
