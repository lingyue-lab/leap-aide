<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Hermes WebUI</title>
    <script>
      // Theme initialization - must run before paint
      (function() {
        var t = localStorage.getItem('hermes-theme');
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (!t) t = 'dark';
        document.documentElement.setAttribute('data-theme', t);

        // Font size initialization - must run before paint
        var fs = localStorage.getItem('hermes-font-size') || 'medium';
        var zoomMap = { small: '0.8', medium: '1', large: '1.3' };
        document.documentElement.setAttribute('data-font-size', fs);
        document.documentElement.style.setProperty('--app-zoom', zoomMap[fs] || '1');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
