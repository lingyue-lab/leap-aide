name: build-cicd-builder-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/images/cicd-builder/**'
      - '.github/workflows/build-cicd-builder-image.yml'

jobs:
  publish:
    name: Build and publish CICD builder image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CICD builder image
        uses: docker/build-push-action@v6
        with:
          context: .github/images/cicd-builder
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leap-aide-cicd-builder:ubuntu-24.04
