name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml>=6.0 pytest pytest-timeout

      # CI does not have access to hermes-agent SDK (it lives only on the
      # testbox at /usr/local/lib/hermes-agent), so agent-dependent tests
      # will be auto-skipped via conftest.py's pytest_collection_modifyitems.
      # Full coverage (including agent-dependent cases) runs via
      # `./scripts/run-test.sh full` on the testbox before release.
      #
      # No global --timeout flag: pytest-timeout's os._exit(1) on slow tests
      # would tear down the session-scoped test_server fixture mid-run.
      # Hung tests should be opted into per-test via `@pytest.mark.timeout(N)`.
      - name: Run backend tests
        run: pytest tests/ -v

  frontend:
    name: Frontend vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent

      # Install vitest + testing-library explicitly so the test script can
      # find them even if package.json has not yet been updated to declare
      # them as devDependencies. `npm install --save-dev` makes the change
      # permanent; `npm ci` here would otherwise fail to resolve them.
      - name: Install vitest toolchain
        working-directory: frontend
        run: npm install --save-dev --silent vitest @testing-library/react @testing-library/jest-dom jsdom

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  docker-backend:
    name: Backend pytest (buildah cicd image)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show buildah version
        run: buildah --version

      - name: Build cicd image with buildah
        run: |
          # Read the shared commit pin from the source-of-truth env file.
          _commit=$(grep '^HERMES_AGENT_COMMIT=' backend/scripts/hermes-agent.env | cut -d= -f2-)
          # buildah needs --layers for layer-cache parity with docker buildx.
          # --ignorefile (no hyphen) overrides the default ignore so tests/ is
          # included in the build context.
          buildah bud \
            --target cicd \
            --layers \
            --build-arg "HERMES_AGENT_COMMIT=${_commit}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --ignorefile .dockerignore.cicd \
            --tag leap-aide:cicd \
            -f Dockerfile .

      - name: Run pytest inside cicd image
        # Use buildah push to the docker daemon so `docker run` can launch it.
        # On ubuntu-latest runners the buildah store is daemon-less by default;
        # pushing to docker-daemon: makes it visible to `docker run`.
        run: |
          buildah push --format docker leap-aide:cicd docker-daemon:leap-aide:cicd
          docker run --rm leap-aide:cicd pytest backend/tests/ -v
