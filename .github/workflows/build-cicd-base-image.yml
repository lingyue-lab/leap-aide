name: build-cicd-base-image

on:
  workflow_dispatch:
  push:
    # Temporary for debugging on the wip branch; change back to [main] after verification.
    branches: [wip/build-runtime-docker-image-workflow]
    paths:
      - '.github/images/cicd-buildah/**'
      - '.github/workflows/build-cicd-base-image.yml'

jobs:
  publish:
    name: Build and publish CICD base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CICD base image
        uses: docker/build-push-action@v6
        with:
          context: .github/images/cicd-buildah
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leap-aide-cicd-base:ubuntu-24.04
