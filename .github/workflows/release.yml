name: Release & Docker

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required: create GitHub Release
      packages: write   # required: push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Create GitHub Release from tag with auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Set up multi-arch build (QEMU + Buildx)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract tags from the git ref (supports vX.Y and vX.Y.Z formats)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(\d+\.\d+(?:\.\d+)?),group=1
            type=raw,value=latest

      # Resolve the hermes-agent pin in a shell step. Values inside a `uses:`
      # step's `with:` block are NOT shell-expanded by GitHub Actions, so the
      # previous inline `$(grep ...)` in build-args was passed to the builder
      # as a literal string — and then to install.sh's `--hermes-commit`.
      - name: Resolve hermes-agent pin
        id: pin
        run: |
          if [ ! -f .build.env ]; then
            echo "::error::.build.env is missing at the repo root"
            exit 1
          fi
          commit=$(grep '^HERMES_AGENT_COMMIT=' .build.env | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$commit" ]; then
            echo "::notice::no HERMES_AGENT_COMMIT in .build.env — this release image installs hermes-agent unpinned"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # Build and push multi-arch image (amd64 + arm64)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_VERSION=${{ github.ref_name }}
            HERMES_AGENT_COMMIT=${{ steps.pin.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
