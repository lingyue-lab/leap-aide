version: "3.8"

services:
  leap-aide:
    # Site-specific registry stays out of git — override via env, e.g.
    #   LEAP_AIDE_IMAGE=<registry>/<image>:<tag> docker compose up
    image: ${LEAP_AIDE_IMAGE:-leap-aide-runtime:0.1.2}
    ports:
      - "8787:8787"
    volumes:
      # Mount your persistent directories into the container.
      # Persistent state directory
      - ${HOME}/.hermes:/home/leap-aide/.hermes
      # Persistent workspace directory
      - ${HOME}/.hermes_workspaces:/workspaces
    environment:
      # You can set enviroments to override .env.
      # Set to your host user ID: run `id -u` and `id -g` to find them.
      # Without this, the container may not be able to read your mounted files.
      # Host uid/gid that must own files inside the mounted directories.
      # `scripts/ctl.sh start-docker` injects the invoking user's ids and handles
      # rootless podman (userns keep-id). 1000 keeps the historical default for
      # plain `docker compose up -d`.
      - WANTED_UID=${WANTED_UID:-1000}
      - WANTED_GID=${WANTED_GID:-1000}
      - HERMES_WEBUI_AGENT_DIR=/usr/local/lib/hermes-agent
      - HERMES_WEBUI_HOST=0.0.0.0
      # Where to store sessions, workspaces, and other state.
      # Must live under the mounted ~/.hermes volume to persist across rebuilds.
      - HERMES_WEBUI_STATE_DIR=/home/leap-aide/.hermes/webui
      # hermes-agent state dir (sessions, logs, memories, config, .env) — must
      # live under the mounted ~/.hermes volume. Mirrors the entrypoint default.
      - HERMES_HOME=/home/leap-aide/.hermes
      - HERMES_WEBUI_PASSWORD=lingyue-lab
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/workspaces
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=
    restart: unless-stopped
    # In-container `ctl.sh stop` waits up to SHUTDOWN_TIMEOUT=8s for the
    # server/gateway to exit; the engine default of 10s leaves too little
    # headroom and used to SIGKILL the tree mid-shutdown.
    stop_grace_period: 30s
    # Truthful readiness: /health answers 503 {"status":"initializing"} until
    # the server finishes post-bind init (issue #3), so `healthy` only shows
    # once the UI actually answers. The image serves HTTPS (self-signed cert
    # via baked .env) — hence curl -sk for the https probe with a plain-http
    # fallback for TLS-less deployments.
    healthcheck:
      test: ["CMD-SHELL",
             "curl -skf https://localhost:8787/health | grep -q '\"status\":\"ok\"' ||
              curl -sf  http://localhost:8787/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
      # Note: daemonless podman (`podman run -d` via podman-compose) never
      # schedules these probes — the container stays "(starting)" forever;
      # only docker / podman-over-API runs them. `ctl.sh start-docker`
      # therefore waits on /health from the host side for podman users.

# Host-dependent settings (container MTU for uplinks below 1500, registry
# mirrors, ...) do NOT belong here — put them in docker-compose.local.yml
# (gitignored) and pass `-f docker-compose.local.yml` to ctl.sh start/stop.
# See docker-compose.local.yml.example for a starting point.
